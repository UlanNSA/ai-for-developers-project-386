# Tool versions are pinned exactly so local runs and CI use identical toolchains.
[tools]
java = "temurin-21.0.13+9.0.LTS"
node = "24.22.2"

# Gradle is started via the wrapper jar directly so the same command works in
# PowerShell, cmd and POSIX shells (no ./gradlew vs gradlew.bat difference).
#
# Dependency graph of `check:fast` (mise runs independent tasks in parallel):
#   install -> api:build -> api:drift -> sdk:generate -> frontend:typecheck -> frontend:build
#                                                     \-> frontend:lint, frontend:test
#   api:drift -> backend:check (ktlint + test + assemble in ONE Gradle run)
#   install -> api:format-check
# Shared artifacts: api:build only writes api/.tmp/openapi (never the committed
# contract); sdk:generate is the only writer of frontend/src/api/generated;
# frontend:typecheck and frontend:build both run `tsc -b`, so they are chained;
# backend:lint/test/build must not run in parallel with each other (they share
# backend/build), hence the single backend:check run.

[tasks.install]
description = "Install npm dependencies (api, frontend, e2e)"
run = [
  "npm ci --ignore-scripts --prefix api",
  "npm ci --ignore-scripts --prefix frontend",
  "npm ci --ignore-scripts --prefix e2e",
]

[tasks."api:format-check"]
description = "Check TypeSpec formatting"
depends = ["install"]
dir = "api"
run = "npm run format:check"

[tasks."api:build"]
description = "Compile TypeSpec into a clean scratch dir (api/.tmp/openapi); does not touch the committed contract"
depends = ["install"]
dir = "api"
run = "npm run build:fresh"

[tasks."api:drift"]
description = "Fail if the committed api/openapi/openapi.yaml differs byte-for-byte from a fresh build"
depends = ["api:build"]
dir = "api"
run = "npm run drift"

[tasks."api:update"]
description = "Regenerate the committed api/openapi/openapi.yaml from the TypeSpec sources (commit the result)"
depends = ["install"]
dir = "api"
run = "npm run build"

[tasks."sdk:generate"]
description = "Generate the TypeScript SDK from OpenAPI"
depends = ["api:drift"]
dir = "frontend"
run = "npm run generate:sdk"

[tasks."frontend:typecheck"]
depends = ["sdk:generate"]
dir = "frontend"
run = "npm run typecheck"

[tasks."frontend:lint"]
description = "ESLint with --max-warnings 0"
depends = ["sdk:generate"]
dir = "frontend"
run = "npm run lint"

[tasks."frontend:test"]
depends = ["sdk:generate"]
dir = "frontend"
run = "npm test"

[tasks."frontend:build"]
# Chained after typecheck: both run `tsc -b` and would race on its build info.
depends = ["frontend:typecheck"]
dir = "frontend"
run = "npm run build"

# Individual backend tasks for local use. Do not run them in parallel with each
# other (shared backend/build); `check:fast` uses backend:check instead.
[tasks."backend:lint"]
description = "ktlint"
dir = "backend"
run = "java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain ktlintCheck"

[tasks."backend:test"]
description = "JUnit tests (read the committed contract, so it is drift-checked first)"
depends = ["api:drift"]
dir = "backend"
run = "java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain test"

[tasks."backend:build"]
description = "Assemble backend"
dir = "backend"
run = "java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain assemble"

[tasks."backend:check"]
description = "ktlint + JUnit tests + assemble in a single Gradle run"
depends = ["api:drift"]
dir = "backend"
run = "java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain ktlintCheck test assemble"

[tasks."dev:backend"]
description = "Run Ktor on :8080"
dir = "backend"
run = "java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain run"

[tasks."dev:frontend"]
description = "Run Vite dev server (proxies /api to :8080)"
depends = ["sdk:generate"]
dir = "frontend"
run = "npm run dev"

[tasks."check:fast"]
description = "Everything except E2E: contract (format + drift), SDK, frontend, backend. The CI job `check` runs it; `e2e` is a separate CI job"
depends = [
  "api:format-check",
  "version:check",
  "smoke:test",
  "e2e:typecheck",
  "frontend:build",
  "frontend:lint",
  "frontend:test",
  "backend:check",
]

[tasks."version:test"]
description = "Unit tests (node --test, no dependencies) for the version sync check"
run = "node --test scripts/version-check.test.mjs"

[tasks."version:check"]
description = "Fail if version.txt, package.json/package-lock.json (api, frontend, e2e) and backend/build.gradle.kts disagree"
depends = ["version:test"]
run = "node scripts/version-check.mjs"

[tasks."smoke:test"]
description = "Unit tests (node --test, no dependencies) for the smoke script scripts/smoke.mjs"
run = "node --test scripts/smoke.test.mjs"

[tasks.smoke]
description = "Smoke-check a running app: mise run smoke -- <url> [--booking] [--wait <s>]. --booking creates FICTIONAL data (never run it automatically against the public deployment)"
run = "node scripts/smoke.mjs"

[tasks."e2e:typecheck"]
description = "tsc for the E2E package (Playwright transpiles tests without type checking)"
depends = ["install"]
dir = "e2e"
run = "npm run typecheck"

[tasks."e2e:install"]
description = "Download the Chromium build for Playwright (no-op when present). Behind a corporate TLS proxy see README"
depends = ["install"]
dir = "e2e"
run = "npx playwright install chromium"

[tasks.e2e]
description = "Browser E2E (Playwright): starts the real backend in test mode and Vite, runs the tests"
depends = ["sdk:generate", "e2e:install"]
dir = "e2e"
run = "npx playwright test"

[tasks.check]
description = "Full check: check:fast + browser E2E"
depends = ["check:fast", "e2e"]
