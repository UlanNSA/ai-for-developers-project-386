name: ci

# Every push (any branch) and every pull request is checked. A push to a branch
# with an open pull request fires both events; the concurrency group is keyed by
# the branch name (head_ref for pull requests, ref_name for pushes), so the
# duplicate run for the same branch is cancelled and superseded runs never pile up.
on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # jdx/mise-action v5.2.5; installs the pinned mise and the tools from mise.toml
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195
        with:
          version: 2026.10.25

      # actions/cache v6.1.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('backend/**/*.gradle.kts', 'backend/gradle/libs.versions.toml', 'backend/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # Contract format + drift, SDK, frontend and backend checks (everything except E2E).
      - run: mise run check:fast

  # Browser E2E: the real Ktor backend in test mode (fixed clock, reset route, loopback only) plus Vite.
  # Test mode (CALENDAR_TEST_MODE) is set by e2e/playwright.config.ts for this job's local processes only;
  # nothing is deployed and no public service ever runs with it.
  e2e:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # jdx/mise-action v5.2.5; installs the pinned mise and the tools from mise.toml
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195
        with:
          version: 2026.10.25

      # actions/cache v6.1.0 (Gradle dependencies only; the browser is deliberately not cached)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('backend/**/*.gradle.kts', 'backend/gradle/libs.versions.toml', 'backend/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # npm dependencies first (mise task `install`), then Chromium plus its Linux system libraries.
      # `--with-deps` uses sudo and apt, so it is called directly instead of through the cross-platform mise task.
      - run: mise run install
      - run: mise exec -- npx playwright install --with-deps chromium
        working-directory: e2e

      - run: mise run e2e

      # actions/upload-artifact v7.0.2; also on failure, to inspect the report and traces
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # The production image: builds the Dockerfile, runs it as Hexlet/Render will (PORT=8080, memory limited like
  # Render Free) and smoke-checks it. The booking scenario creates fictional data in the throwaway container
  # only; it is never run against the public deployment.
  docker:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # jdx/mise-action v5.2.5; only Node is needed (to run scripts/smoke.mjs)
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195
        with:
          version: 2026.10.25
          install_args: node

      - name: Build the image
        run: docker build --tag calendar:ci .

      - name: Run the container (PORT=8080, 512 MB like Render Free)
        run: docker run --detach --name calendar --memory 512m --publish 8080:8080 --env PORT=8080 calendar:ci

      - name: The app answers on PORT and GET / returns 200
        run: |
          for i in $(seq 1 60); do
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/ || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          echo "GET / -> $code"
          test "$code" = "200"
          test "$(curl --silent --fail http://localhost:8080/api/health)" = '{"status":"ok"}'

      - name: The container does not run as root
        run: |
          uid=$(docker exec calendar id -u)
          echo "container uid: $uid"
          test "$uid" != "0"

      - name: Smoke test with the booking scenario (fictional data, throwaway container)
        run: node scripts/smoke.mjs http://localhost:8080 --booking --wait 30

      - name: The JVM stays inside the 512 MB limit
        run: |
          docker stats --no-stream --format 'memory: {{.MemUsage}}' calendar
          test "$(docker inspect --format '{{.State.OOMKilled}}' calendar)" = "false"
          test "$(docker inspect --format '{{.State.Running}}' calendar)" = "true"

      - name: The app honours another PORT
        run: |
          docker run --detach --name calendar-9090 --publish 9090:9090 --env PORT=9090 calendar:ci
          for i in $(seq 1 60); do
            curl --silent --fail --output /dev/null http://localhost:9090/ && break
            sleep 2
          done
          test "$(curl --silent --fail http://localhost:9090/api/health)" = '{"status":"ok"}'

      - name: Container logs
        if: ${{ always() }}
        run: |
          docker logs calendar || true
          docker logs calendar-9090 || true
