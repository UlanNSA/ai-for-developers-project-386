name: release-please

# One product version for the whole monorepo (see README, "Releases").
# Uses the default GITHUB_TOKEN only; no PAT and no secrets. Requires the repository
# setting Settings -> Actions -> General -> "Allow GitHub Actions to create and approve pull requests".
on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # googleapis/release-please-action v5.0.0
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
