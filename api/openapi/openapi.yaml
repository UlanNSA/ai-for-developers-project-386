openapi: 3.0.0
info:
  title: Calendar API
  version: 0.0.0
tags: []
paths:
  /api/bookings:
    post:
      operationId: createBooking
      description: Creates a confirmed booking. Checks run in the order 400, 404, 422, 409.
      parameters: []
      responses:
        '201':
          description: The booking was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: MALFORMED_REQUEST (not valid JSON) or VALIDATION_ERROR (rules, unknown fields; with fieldErrors).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: The meeting type does not exist (an unknown or malformed id gives the same answer).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: 'The start is valid but overlaps a confirmed booking of any meeting type: SLOT_TAKEN.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: 'The start is not one the schedule, grid, horizon or current time would ever offer: INVALID_SLOT.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Unhandled server failure; the body never contains internal details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
    get:
      operationId: listBookings
      description: |-
        Upcoming bookings of ALL meeting types: `startAt` strictly after the current moment, ascending by
        `startAt`. No pagination. Started and past bookings are not returned.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
        '500':
          description: Unhandled server failure; the body never contains internal details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/health:
    get:
      operationId: getHealth
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/meeting-types:
    get:
      operationId: listMeetingTypes
      description: All meeting types in creation order.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MeetingType'
        '500':
          description: Unhandled server failure; the body never contains internal details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      operationId: createMeetingType
      description: Creates a meeting type; titles may repeat.
      parameters: []
      responses:
        '201':
          description: The meeting type was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingType'
        '400':
          description: MALFORMED_REQUEST (not valid JSON) or VALIDATION_ERROR (rules, unknown fields; with fieldErrors).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Unhandled server failure; the body never contains internal details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMeetingTypeRequest'
  /api/meeting-types/{id}:
    get:
      operationId: getMeetingType
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingType'
        '404':
          description: The meeting type does not exist (an unknown or malformed id gives the same answer).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Unhandled server failure; the body never contains internal details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/meeting-types/{id}/slots:
    get:
      operationId: listSlots
      description: Free slots within the booking horizon, sorted by `startAt`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Slot'
        '404':
          description: The meeting type does not exist (an unknown or malformed id gives the same answer).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Unhandled server failure; the body never contains internal details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/owner:
    get:
      operationId: getOwner
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Owner'
        '500':
          description: Unhandled server failure; the body never contains internal details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    Booking:
      type: object
      required:
        - id
        - meetingTypeId
        - startAt
        - endAt
        - guestName
        - guestEmail
      properties:
        id:
          type: string
          format: uuid
        meetingTypeId:
          type: string
          format: uuid
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        guestName:
          type: string
        guestEmail:
          type: string
      description: A confirmed booking. `endAt` is computed by the backend as `startAt + durationMinutes`.
    CreateBookingRequest:
      type: object
      required:
        - meetingTypeId
        - startAt
        - guestName
        - guestEmail
      properties:
        meetingTypeId:
          type: string
          format: uuid
        startAt:
          type: string
          format: date-time
          description: UTC instant ending with `Z`, a start the schedule offers for the meeting type.
        guestName:
          type: string
          minLength: 1
          maxLength: 100
          description: 1 to 100 characters after trim.
        guestEmail:
          type: string
          maxLength: 254
          description: Up to 254 characters; exactly one `@`, a non-empty local part, a domain with a dot. Case is preserved.
      description: |-
        Body of POST /api/bookings. Unknown fields (including a client `endAt`) and a `startAt` that is not
        UTC with a trailing `Z` are rejected with 400. Name length is counted after trim in Unicode code points.
    CreateMeetingTypeRequest:
      type: object
      required:
        - title
        - durationMinutes
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
          description: 1 to 100 characters after trim.
        description:
          type: string
          maxLength: 500
          description: Up to 500 characters after trim; blank counts as absent.
        durationMinutes:
          type: integer
          format: int32
          minimum: 15
          maximum: 240
          description: Whole minutes, a multiple of 15, 15 to 240.
      description: Body of POST /api/meeting-types. Lengths are counted after trim in Unicode code points.
    FieldError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
        message:
          type: string
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
    MeetingType:
      type: object
      required:
        - id
        - title
        - durationMinutes
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        durationMinutes:
          type: integer
          format: int32
          description: Duration in minutes (a multiple of 15, 15 to 240).
    Owner:
      type: object
      required:
        - name
        - bio
        - timeZone
      properties:
        name:
          type: string
        bio:
          type: string
        timeZone:
          type: string
          description: IANA time zone id, e.g. Asia/Almaty
    Slot:
      type: object
      required:
        - startAt
        - endAt
      properties:
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
      description: A free time range for a meeting type; both instants are UTC.
servers:
  - url: http://localhost:8080
    description: Local development
    variables: {}
