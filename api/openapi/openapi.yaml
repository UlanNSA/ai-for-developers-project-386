openapi: 3.0.0
info:
  title: Calendar API
  version: 0.0.0
tags: []
paths:
  /api/health:
    get:
      operationId: getHealth
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/meeting-types:
    get:
      operationId: listMeetingTypes
      description: All meeting types in creation order.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MeetingType'
        '500':
          description: Unhandled server failure; the body never contains internal details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      operationId: createMeetingType
      description: Creates a meeting type; titles may repeat.
      parameters: []
      responses:
        '201':
          description: The meeting type was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingType'
        '400':
          description: MALFORMED_REQUEST (not valid JSON) or VALIDATION_ERROR (rules, unknown fields; with fieldErrors).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Unhandled server failure; the body never contains internal details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMeetingTypeRequest'
  /api/meeting-types/{id}:
    get:
      operationId: getMeetingType
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingType'
        '404':
          description: The meeting type does not exist (an unknown or malformed id gives the same answer).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Unhandled server failure; the body never contains internal details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/owner:
    get:
      operationId: getOwner
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Owner'
        '500':
          description: Unhandled server failure; the body never contains internal details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    CreateMeetingTypeRequest:
      type: object
      required:
        - title
        - durationMinutes
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
          description: 1 to 100 characters after trim.
        description:
          type: string
          maxLength: 500
          description: Up to 500 characters after trim; blank counts as absent.
        durationMinutes:
          type: integer
          format: int32
          minimum: 15
          maximum: 240
          description: Whole minutes, a multiple of 15, 15 to 240.
      description: Body of POST /api/meeting-types. Lengths are counted after trim in Unicode code points.
    FieldError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
        message:
          type: string
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
    MeetingType:
      type: object
      required:
        - id
        - title
        - durationMinutes
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        durationMinutes:
          type: integer
          format: int32
          description: Duration in minutes (a multiple of 15, 15 to 240).
    Owner:
      type: object
      required:
        - name
        - bio
        - timeZone
      properties:
        name:
          type: string
        bio:
          type: string
        timeZone:
          type: string
          description: IANA time zone id, e.g. Asia/Almaty
servers:
  - url: http://localhost:8080
    description: Local development
    variables: {}
